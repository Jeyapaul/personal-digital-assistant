name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m py_compile scripts/*.py .hermes/plugins/personal-assistant-mail/*.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check shell syntax
        run: sh -n scripts/*.sh docker/container-entrypoint.sh
