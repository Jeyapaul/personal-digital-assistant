# Explicit allowlist for the personal-assistant container.
# This proxy is reachable only on the internal Docker network.
http_port 3128
dns_v4_first on

acl localnet src 172.16.0.0/12
acl allowed_ports port 80 443 1234
acl CONNECT method CONNECT
acl allowed_destinations dstdomain gmail.googleapis.com oauth2.googleapis.com graph.microsoft.com login.microsoftonline.com discord.com .discord.gg cdn.discordapp.com host.docker.internal

http_access deny !allowed_ports
http_access deny CONNECT !allowed_ports
http_access allow localnet allowed_destinations
http_access deny all

cache deny all
cache_mem 0 MB
cache_dir null /var/cache/squid
access_log none
cache_log none
pid_filename none
coredump_dir /var/cache/squid
