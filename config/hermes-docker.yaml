# Docker runtime profile. This is mounted read-only over /data/config.yaml.
# It keeps the host-local profile separate from the container's host gateway
# address for LM Studio.
_config_version: 40

timezone: Asia/Kolkata

# Deliver scheduled reports without Hermes' technical cron wrapper.
cron:
  wrap_response: false

model:
  default: pda-qwen30
  provider: lmstudio
  base_url: http://host.docker.internal:1234/v1
  api_mode: chat_completions
  context_length: 32768
  max_tokens: 8192

database:
  journal_mode: wal

agent:
  max_turns: 6
  reasoning_effort: none

tools:
  tool_search:
    enabled: off
  disabled_toolsets:
    - terminal
    - file
    - browser
    - web
    - code_execution
    - computer_use
    - delegation
    - cronjob
    - memory
    - session_search
    - skills
    - mcp
    - project
    - todo
    - clarify
    - discord_admin
    - a2a
    # The pre-run collector performs the fixed operation; the cron script is
    # delivered directly and cannot trigger a second collection.
    - personal-assistant-mail

toolsets:
  - personal-assistant-mail

plugins:
  enabled:
    - personal-assistant-mail
  disabled: []

platform_toolsets:
  cli:
    - personal-assistant-mail
  discord: []

discord:
  require_mention: true
  ignored_channels:
    - '*'
  auto_thread: false

telemetry:
  shared_metrics:
    enabled: false

memory:
  memory_enabled: false
  user_profile_enabled: false
