# Phase 2 mail-source policy. Credentials are never stored in this repository.
# Expected private OAuth files under the persistent Hermes data directory:
#   credentials/gmail.json
#   credentials/microsoft.json
# These are created by the project-local narrow OAuth setup scripts.

sources:
  gmail:
    enabled: true
    oauth_scope: https://www.googleapis.com/auth/gmail.readonly
    token_file: credentials/gmail.json
    oauth_setup: scripts/google-gmail-oauth.py
  microsoft:
    enabled: true
    oauth_scope: Mail.Read
    token_file: credentials/microsoft.json
    oauth_setup: scripts/microsoft-mail-oauth.py

policy:
  timezone: Asia/Kolkata
  window: previous_ist_calendar_day
  unread_only: true
  leave_unread: true
  download_attachments: false
  include_attachment_names: true
  report_batch_size: 25
  # Provider pagination continues until exhaustion; batches are only a Discord/report limit.
  # Keep each model-facing body bounded for local-model context windows.
  max_body_chars: 250
  allowed_api_hosts:
    - gmail.googleapis.com
    - graph.microsoft.com
  scheduled_connector: fixed_api_adapters
  himalaya_enabled: false

management:
  new_mail_review_enabled: true
  historical_backfill_enabled: false
  initial_cursor: deployment_time
  max_new_messages_per_source: 15
  mutation_enabled: true
  approval_expiry_hours: 0  # 0 means approval requests remain open indefinitely
  unsubscribe_https_host_allowlist: []
  # mailto unsubscribe requires a separate send permission and remains disabled.
  # The next scheduled run finalizes this only after the prior run records
  # successful Discord delivery; failed/ambiguous delivery leaves mail unread.
  mark_reported_read_after_discord_delivery: true
