# Phase 1 Hermes profile template.
# scripts/prepare-hermes-home.sh copies this to the persistent Hermes home.

_config_version: 40

timezone: Asia/Kolkata

# Deliver scheduled reports without Hermes' technical cron wrapper.
cron:
  wrap_response: false

model:
  # LM Studio host model; the Docker profile uses host.docker.internal.
  default: pda-qwen30
  provider: lmstudio
  base_url: http://127.0.0.1:1234/v1
  api_mode: chat_completions
  context_length: 32768
  max_tokens: 8192

database:
  # Safer default for a macOS bind-mounted persistent directory.
  journal_mode: wal

agent:
  max_turns: 6

# Keep the fixed mail tool directly visible; the scheduled profile has only
# one model-facing operation and should not spend turns searching tool catalogs.
tools:
  tool_search:
    enabled: off
  # These remain disabled even if a broader platform bundle is enabled later.
  disabled_toolsets:
    - terminal
    - file
    - browser
    - web
    - code_execution
    - computer_use
    - delegation
    - cronjob
    - memory
    - session_search
    - skills
    - mcp
    - project
    - todo
    - clarify
    - discord_admin
    - a2a
    - personal-assistant-mail

# Phase 2 exposes only the fixed read-only mail capability.
toolsets:
  - personal-assistant-mail

plugins:
  enabled:
    - personal-assistant-mail
  disabled: []

# Keep platform bundles empty until Discord delivery is implemented.
platform_toolsets:
  cli:
    - personal-assistant-mail
  # The Discord gateway may run, but Discord tools are not exposed to agents.
  discord: []

discord:
  require_mention: true
  ignored_channels:
    - '*'
  auto_thread: false

telemetry:
  shared_metrics:
    enabled: false

memory:
  memory_enabled: false
  user_profile_enabled: false
